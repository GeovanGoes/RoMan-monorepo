spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roman}
    username: ${DB_USER:roman}
    password: ${DB_PASSWORD:roman}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    # Injeta o correlation ID (MDC) em toda linha de log — mesmo mecanismo usado pelo
    # Micrometer Tracing pra traceId/spanId, mas funciona com qualquer chave de MDC.
    correlation: "[%X{correlationId:-}] "

app:
  jwt:
    secret: ${JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    access-token-expiration: 900
    refresh-token-expiration: 604800
  encryption:
    field-key: ${FIELD_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    email-hmac-key: ${EMAIL_HMAC_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    url: ${FRONTEND_URL:http://localhost:3000}
